# Camunda 8 Plugin
camunda.client.mode=self-managed
camunda.client.enabled=true
# Defaults for self-managed mode. Camunda 8.9's CamundaClientPropertiesPostProcessor used to
# contribute these, but it is registered under the 'org.springframework.boot.env.EnvironmentPostProcessor'
# key, which Spring Boot 4.2 no longer loads. The real addresses are taken from the
# Camunda Process Test runtime in Camunda8TestSetupListener.
camunda.client.grpc-address=http://localhost:26500
camunda.client.rest-address=http://localhost:8080
camunda.client.auth.method=none
